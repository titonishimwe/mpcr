<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon Group -->
  <g transform="translate(15, 8)">
    <!-- Laurel Wreath Leaves (Left) -->
    <path d="M 38,92 C 18,80 12,50 24,28 C 26,34 30,38 36,40 C 25,48 24,70 38,92 Z" fill="url(#greenGrad)" opacity="0.9"/>
    <circle cx="20" cy="38" r="4.5" fill="#10B981"/>
    <circle cx="16" cy="54" r="5" fill="#10B981"/>
    <circle cx="19" cy="70" r="4.5" fill="#10B981"/>
    <circle cx="28" cy="82" r="4" fill="#10B981"/>

    <!-- Laurel Wreath Leaves (Right) -->
    <path d="M 66,92 C 86,80 92,50 80,28 C 78,34 74,38 68,40 C 79,48 80,70 66,92 Z" fill="url(#greenGrad)" opacity="0.9"/>
    <circle cx="84" cy="38" r="4.5" fill="#10B981"/>
    <circle cx="88" cy="54" r="5" fill="#10B981"/>
    <circle cx="85" cy="70" r="4.5" fill="#10B981"/>
    <circle cx="76" cy="82" r="4" fill="#10B981"/>

    <!-- Dove of the Holy Spirit (Top) -->
    <path d="M 52,14 C 47,8 38,10 33,6 C 36,12 42,16 48,18 C 45,21 44,25 46,28 C 49,24 51,20 52,14 Z" fill="#94A3B8"/>
    <path d="M 52,14 C 57,8 66,10 71,6 C 68,12 62,16 56,18 C 59,21 60,25 58,28 C 55,24 53,20 52,14 Z" fill="#CBD5E1"/>
    <circle cx="52" cy="17" r="3.5" fill="#E2E8F0"/>

    <!-- Golden Cross -->
    <g filter="url(#shadow)">
      <!-- Vertical beam -->
      <rect x="46" y="24" width="12" height="64" rx="2" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.2"/>
      <!-- Horizontal beam -->
      <rect x="30" y="40" width="44" height="12" rx="2" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.2"/>
      <!-- Center Text MPCR -->
      <text x="52" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="1">MPCR</text>
    </g>

    <!-- Bottom Banner (Jean 3:16) -->
    <g filter="url(#shadow)">
      <path d="M 22,90 L 82,90 L 88,97 L 82,104 L 22,104 L 16,97 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.2"/>
      <text x="52" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#854D0E" text-anchor="middle">Jean 3:16</text>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 24)">
    <text x="0" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0F2942" letter-spacing="0.5">MOVEMENT FOR CHRIST IN RWANDA</text>
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#15803D" letter-spacing="0.4">MOUVEMENT POUR CHRIST AU RWANDA</text>
    <text x="0" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#B45309" letter-spacing="2">M.P.C.R.</text>
    <text x="0" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-style="italic" fill="#64748B">"That whoever believes in HIM should not perish but have eternal life" — John 3:16</text>
  </g>
</svg>
