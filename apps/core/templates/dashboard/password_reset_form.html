{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password - MPCR</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="dash-body">
  <main class="dash-login">
    <section class="dash-login-card">
      <h1>Forgot password?</h1>
      <p>Enter the email currently saved on the account. An address that is still waiting for confirmation is not used.</p>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email">Email</label>
          <input class="form-input" type="email" name="email" id="id_email" autocomplete="email" required>
        </div>
        {% for error in form.email.errors %}
          <p class="dash-field-error">{{ error }}</p>
        {% endfor %}
        <button type="submit" class="btn btn-primary dash-submit">Send reset link</button>
      </form>
      <a href="{% url 'dashboard_login' %}" class="dash-back">Back to sign in</a>
    </section>
  </main>
</body>
</html>
