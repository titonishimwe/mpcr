{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<section class="error-page-section">
  <div class="container">
    <h1 class="error-code">403</h1>
    <h2 class="error-title">Access Denied</h2>

    </p>
    <a href="{% url 'home' %}" class="btn btn-primary">Return Home</a>
  </div>
</section>
{% endblock %}
